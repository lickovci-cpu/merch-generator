name: Generate Rhythmix Merch

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install openai
      - name: Generate designs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p designs
          node -e "
          const OpenAI = require('openai');
          const client = new OpenAI();
          (async () => {
            const msg = await client.chat.completions.create({
              model: 'gpt-4o-mini',
              messages: [{role: 'user', content: 'Vygeneruj JSON s 3 Rhythmix design prompty (trika, hoodie, tanktop). Format: {\"designs\": [{\"product\": \"...\", \"style\": \"...\"}]}'}]
            });
            console.log(msg.choices[0].message.content);
          })();
          " > designs/prompts.json
      - run: git add designs/ && git commit -m '🎨 Rhythmix designs' && git push || true
